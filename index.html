    .card {

      text-align: center;
      animation: fadeIn 0.8s ease;
    }


    h1{

    font-size: 40px;
    color: #0f3460;
    letter-spacing: 1px;
}
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .card h1 {
      font-size: 2.4rem;
      color: #0f3460;
      margin: 20px 0 8px;
      letter-spacing: 2px;
    }

    .card p {
      color: #666;
      font-size: 1rem;
      padding: 0 24px 24px;
      line-height: 1.6;
    }

      border-radius: 50px;
      margin-bottom: 28px;

    .whatsapp-btn:hover {

      box-shadow: 0 12px 28px rgba(37, 211, 102, 0.55);
    }

    .whatsapp-btn svg {

      height: 24px;
