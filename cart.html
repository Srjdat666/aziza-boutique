<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب | AZIZA Boutique</title>
  <meta name="theme-color" content="#6E1F33">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="wrap section">
    <div class="section-head">
      <div><h1 class="section-title">إتمام الطلب</h1><p class="section-sub">راجعي طلبك ثم أكملي البيانات</p></div>
    </div>

    <!-- شريط التقدم -->
    <div class="steps-bar" id="steps-bar">
      <div class="step on" data-step="info"><span>1</span><label>العربة والبيانات</label></div>
      <div class="step" data-step="confirm"><span>2</span><label>التأكيد</label></div>
    </div>

    <div id="cart-root"></div>
  </main>

  <div id="site-footer"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script>
    AZ.ready.then(function () {
      var root = document.getElementById('cart-root');
      var stepsBar = document.getElementById('steps-bar');
      var sending = false;

      // استرجاع بيانات الزبونة المحفوظة (تجربة أفضل)
      function loadInfo() {
        try {
          var j = JSON.parse(localStorage.getItem('aziza_customer') || '{}');
          return j && typeof j === 'object' ? j : {};
        } catch (e) { return {}; }
      }
      function saveInfo(info) {
        try { localStorage.setItem('aziza_customer', JSON.stringify(info)); } catch (e) {}
      }
      var savedInfo = loadInfo();

      function setStep(name) {
        stepsBar.querySelectorAll('.step').forEach(function (s) {
          var k = s.getAttribute('data-step');
          s.classList.toggle('on', k === name);
          s.classList.toggle('done', k === 'info' && name === 'confirm');
        });
      }

      function render() {
        if (AZ.errorBox(root)) return;
        var rows = AZ.cartDetailed();
        var s = AZ.getSettings();

        if (!rows.length) {
          setStep('info');
          root.innerHTML = '<div class="empty"><b>العربة فارغة</b>لم تُضيفي أي منتج بعد.' +
            '<div style="margin-top:1.2rem"><a class="btn btn-primary" href="shop.html">تسوّقي الآن</a></div></div>';
          return;
        }

        var subtotal = rows.reduce(function (a, r) { return a + r.lineTotal; }, 0);
        var shipping = Number(s.shipping) || 0;
        var total = subtotal + shipping;

        var linesHTML = rows.map(function (r) {
          return '<div class="cart-line">' +
            '<a href="product.html?id=' + encodeURIComponent(r.id) + '"><img src="' + AZ.esc(r.image) + '" alt="' + AZ.esc(r.name) + '"></a>' +
            '<div>' +
              '<h3><a href="product.html?id=' + encodeURIComponent(r.id) + '">' + AZ.esc(r.name) + '</a></h3>' +
              '<p class="meta">' + (r.size ? 'المقاس: ' + AZ.esc(r.size) + ' · ' : '') + (r.color ? AZ.esc(r.color) + ' · ' : '') + AZ.money(r.price) + '</p>' +
              '<div class="qty" style="margin-top:.45rem">' +
                '<button type="button" data-key="' + AZ.esc(r.key) + '" data-step-qty="-1" aria-label="تقليل">−</button>' +
                '<input type="number" min="1" max="' + r.stock + '" value="' + r.qty + '" data-qty="' + AZ.esc(r.key) + '" aria-label="الكمية">' +
                '<button type="button" data-key="' + AZ.esc(r.key) + '" data-step-qty="1" aria-label="زيادة">+</button>' +
              '</div>' +
              '<button class="remove-btn" type="button" data-remove="' + AZ.esc(r.key) + '">إزالة</button>' +
            '</div>' +
            '<div class="price">' + AZ.money(r.lineTotal) + '</div>' +
          '</div>';
        }).join('');

        root.innerHTML = '<div class="cart-grid">' +
          '<div>' + linesHTML + '</div>' +
          '<div class="cart-side">' +
            '<h2 class="section-title" style="font-size:1.25rem;margin-bottom:.75rem">ملخص الطلب</h2>' +
            '<div class="sum-row"><span>المجموع الفرعي</span><span>' + AZ.money(subtotal) + '</span></div>' +
            '<div class="sum-row"><span>التوصيل</span><span>' + (shipping ? AZ.money(shipping) : 'مجاني') + '</span></div>' +
            '<div class="sum-row total"><span>الإجمالي</span><span>' + AZ.money(total) + '</span></div>' +
            '<form id="checkout-form" style="margin-top:1.2rem" novalidate>' +
              '<div class="field"><label for="c-name">الاسم الكامل <span class="req-star">*</span></label>' +
                '<input class="input" id="c-name" name="name" required autocomplete="name" aria-describedby="err-name" value="' + AZ.esc(savedInfo.name || '') + '">' +
                '<span class="field-err" id="err-name" role="alert" hidden>أدخلي الاسم الكامل (3 أحرف على الأقل)</span></div>' +
              '<div class="field"><label for="c-phone">رقم الهاتف <span class="req-star">*</span></label>' +
                '<input class="input" id="c-phone" name="phone" type="tel" inputmode="tel" dir="ltr" required autocomplete="tel" placeholder="09xxxxxxxx" aria-describedby="err-phone" value="' + AZ.esc(savedInfo.phone || '') + '">' +
                '<span class="field-err" id="err-phone" role="alert" hidden>رقم هاتف غير صحيح (مثال: 0912345678)</span></div>' +
              '<div class="form-row">' +
                '<div class="field"><label for="c-city">المدينة</label><input class="input" id="c-city" name="city" value="' + AZ.esc(savedInfo.city || 'سرت') + '" autocomplete="address-level2"></div>' +
                '<div class="field"><label for="c-address">العنوان</label><input class="input" id="c-address" name="address" autocomplete="street-address" value="' + AZ.esc(savedInfo.address || '') + '"></div>' +
              '</div>' +
              '<div class="field"><label for="c-note">ملاحظات (اختياري)</label><textarea class="textarea" id="c-note" name="note" rows="2"></textarea></div>' +
              '<label class="checkbox-line"><input type="checkbox" id="c-save" checked> <span>احفظي بياناتي للطلب القادم</span></label>' +
              '<button class="btn btn-wa btn-block btn-lg" type="submit" id="checkout-btn">تأكيد الطلب عبر واتساب</button>' +
              '<p class="hint" style="text-align:center;margin-top:.6rem">سيتم حفظ طلبك وتوجيهك إلى واتساب لتأكيده.</p>' +
            '</form>' +
          '</div>' +
        '</div>';
        setStep('info');
      }

      // أحداث العربة
      root.addEventListener('click', function (e) {
        var stepBtn = e.target.closest('[data-step-qty]');
        if (stepBtn) {
          var key = stepBtn.getAttribute('data-key');
          var row = AZ.cartDetailed().filter(function (r) { return r.key === key; })[0];
          if (row) {
            var next = row.qty + Number(stepBtn.getAttribute('data-step-qty'));
            if (next > row.stock) AZ.toast('وصلتِ لأقصى كمية متوفرة', 'err');
            AZ.setQty(key, next);
          }
          render();
          return;
        }
        var rm = e.target.closest('[data-remove]');
        if (rm) { AZ.removeFromCart(rm.getAttribute('data-remove')); render(); AZ.toast('تمت الإزالة'); }
      });

      root.addEventListener('change', function (e) {
        var inp = e.target.closest('[data-qty]');
        if (!inp) return;
        AZ.setQty(inp.getAttribute('data-qty'), Math.max(1, Number(inp.value) || 1));
        render();
      });

      // إرسال الطلب
      root.addEventListener('submit', function (e) {
        if (e.target.id !== 'checkout-form') return;
        e.preventDefault();
        if (sending) return;

        var f = e.target;
        var name = f.name.value.trim();
        var phone = f.phone.value.trim();
        var phoneDigits = phone.replace(/\D/g, '');

        // تحقق مع رسائل واضحة
        var ok = true;
        function setErr(id, show) {
          var el = document.getElementById(id);
          var fld = el.closest('.field');
          el.hidden = !show;
          if (fld) fld.classList.toggle('has-err', show);
          var inp = fld && fld.querySelector('.input');
          if (inp) inp.setAttribute('aria-invalid', show ? 'true' : 'false');
          if (show) ok = false;
        }
        setErr('err-name', name.length < 3);
        setErr('err-phone', !/^(?:218|0)?9\d{8}$/.test(phoneDigits));

        if (!ok) {
          AZ.toast('يرجى تصحيح البيانات المطلوبة', 'err');
          var firstErr = document.querySelector('.has-err .input');
          if (firstErr) firstErr.focus();
          return;
        }

        var items = AZ.cartDetailed();
        if (!items.length) { render(); return; }

        var subtotal = items.reduce(function (a, r) { return a + r.lineTotal; }, 0);
        var shipping = Number(AZ.getSettings().shipping) || 0;
        var order = AZ.buildOrder(
          { name: name, phone: phone, city: f.city.value.trim(), address: f.address.value.trim(), note: f.note.value.trim() },
          items, subtotal, shipping
        );
        var link = AZ.waLink(AZ.orderMessage(order));

        // حفظ بيانات الزبونة
        if (document.getElementById('c-save').checked) {
          saveInfo({ name: name, phone: phone, city: f.city.value.trim(), address: f.address.value.trim() });
        }

        // فتح نافذة واتساب الآن (داخل نقرة المستخدم) كي لا يحظرها المتصفح، ثم توجيهها بعد الحفظ
        var win = window.open('', '_blank');

        // تعطيل الزر + عرض شريط التقدم
        sending = true;
        var btn = document.getElementById('checkout-btn');
        btn.disabled = true;
        btn.textContent = 'جارٍ الحفظ…';
        setStep('confirm');

        // حفظ الطلب في قاعدة البيانات
        AZ.saveOrder(order).then(function (saved) {
          // حفظ نسخة محلية للصفحة النجاح (لاستخدامها في حالة عدم وجود السحابة)
          try {
            localStorage.setItem('aziza_last_order', JSON.stringify(order));
          } catch (e) {}

          AZ.clearCart();

          // فتح واتساب
          if (win) { try { win.opener = null; win.location.href = link; } catch (e) {} }

          // توجيه إلى صفحة النجاح
          var params = '?id=' + encodeURIComponent(order.id);
          if (!saved) params += '&wa=1'; // علامة إذا فشل الحفظ
          setTimeout(function () { location.href = 'order-success.html' + params; }, 400);
        }).catch(function () {
          if (win) { try { win.close(); } catch (e) {} }
          sending = false;
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب عبر واتساب';
          AZ.toast('تعذر إتمام الطلب، حاولي مرة أخرى', 'err');
        });
      });

      render();
    });
  </script>
</body>
</html>
