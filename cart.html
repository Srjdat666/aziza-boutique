<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب | AZIZA Boutique</title>
  <meta name="theme-color" content="#6E1F33">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="wrap section">
    <div class="section-head">
      <div><h1 class="section-title">إتمام الطلب</h1><p class="section-sub">راجعي طلبك ثم أكملي البيانات</p></div>
    </div>

    <!-- شريط التقدم -->
    <ol class="steps-bar" id="steps-bar" aria-label="مراحل الطلب">
      <li class="step on" data-step="info" aria-current="step"><span aria-hidden="true">1</span><small>العربة والبيانات</small></li>
      <li class="step" data-step="confirm"><span aria-hidden="true">2</span><small>التأكيد</small></li>
    </ol>

    <div id="cart-root"><div class="notice-box">جارٍ تحميل العربة…</div></div>
  </main>

  <div id="site-footer"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script>
    AZ.ready.then(function () {
      var root = document.getElementById('cart-root');
      var stepsBar = document.getElementById('steps-bar');
      var sending = false;

      // استرجاع بيانات الزبونة المحفوظة (تجربة أفضل)
      function loadInfo() {
        try {
          var j = JSON.parse(localStorage.getItem('aziza_customer') || '{}');
          return j && typeof j === 'object' ? j : {};
        } catch (e) { return {}; }
      }
      function saveInfo(info) {
        try { localStorage.setItem('aziza_customer', JSON.stringify(info)); } catch (e) {}
      }
      // مسودة النموذج: تبدأ بالبيانات المحفوظة وتُحدَّث قبل كل إعادة رسم كي لا يضيع ما كتبته الزبونة
      var draft = loadInfo();
      var ratesOk = false;   // هل حُمّلت أسعار التوصيل من قاعدة البيانات؟

      function captureDraft() {
        var f = document.getElementById('checkout-form');
        if (!f) return;
        draft = {
          name: f.name.value, phone: f.phone.value,
          region: f.region.value, city: f.city.value,
          address: f.address.value, note: f.note.value
        };
      }

      /* ===== المنطقة والمدينة وسعر التوصيل ===== */
      // توحيد الكتابة العربية للبحث: بلا تشكيل، أ/إ/آ → ا، ة → ه، ى → ي
      function norm(s) {
        return String(s || '').replace(/[ً-ْـ]/g, '')
          .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
          .replace(/\s+/g, ' ').trim().toLowerCase();
      }
      // بيانات قديمة محفوظة فيها مدينة بلا منطقة (مثل «سرت»): نستنتج المنطقة إن كانت المدينة في منطقة واحدة فقط
      function regionOfCity(city) {
        var found = AZ.getShippingRegions().filter(function (r) {
          return r.cities.some(function (c) { return c.city === city; });
        });
        return found.length === 1 ? found[0].name : '';
      }
      function regionOptions(sel) {
        return '<option value="">اختاري المنطقة</option>' + AZ.getShippingRegions().map(function (r) {
          return '<option value="' + AZ.esc(r.name) + '"' + (r.name === sel ? ' selected' : '') + '>' + AZ.esc(r.name) + '</option>';
        }).join('');
      }
      // بدون منطقة: البحث يشمل كل المدن (الزبونة غالباً تعرف مدينتها لا منطقتها)
      function cityCandidates(region, q) {
        var nq = norm(q), out = [];
        AZ.getShippingRegions().forEach(function (r) {
          if (region && r.name !== region) return;
          if (!region && !nq) return;
          r.cities.forEach(function (c) {
            if (!nq || norm(c.city).indexOf(nq) !== -1) out.push({ region: r.name, city: c.city, price: c.price });
          });
        });
        return out;
      }
      function priceLabel(p) { return p ? AZ.money(p) : 'مجاني'; }
      function cityOptions(region, q, sel) {
        var list = cityCandidates(region, q);
        var ph = (!region && !q) ? 'اختاري المنطقة أولاً أو ابحثي' : (list.length ? 'اختاري المدينة' : 'لا توجد مدينة مطابقة');
        return '<option value="">' + ph + '</option>' + list.map(function (c) {
          return '<option value="' + AZ.esc(c.city) + '" data-region="' + AZ.esc(c.region) + '"' +
            (c.city === sel ? ' selected' : '') + '>' +
            AZ.esc(c.city) + ' — ' + priceLabel(c.price) + (region ? '' : ' (' + AZ.esc(c.region) + ')') +
            '</option>';
        }).join('');
      }
      function refreshCities(keepCity) {
        var reg = document.getElementById('c-region');
        var sel = document.getElementById('c-city');
        var q = document.getElementById('c-city-search');
        if (!reg || !sel) return;
        sel.innerHTML = cityOptions(reg.value, q.value, keepCity || '');
        sel.disabled = !reg.value && !q.value.trim();
        updateShipping();
      }
      // يحدّث سعر التوصيل بجانب المدينة والمجموع النهائي دون إعادة رسم الصفحة
      function updateShipping() {
        var reg = document.getElementById('c-region'), sel = document.getElementById('c-city');
        var shipEl = document.getElementById('sum-ship'), totalEl = document.getElementById('sum-total');
        var tag = document.getElementById('ship-tag');
        if (!reg || !shipEl) return;
        var subtotal = AZ.cartDetailed().reduce(function (a, r) { return a + r.lineTotal; }, 0);
        var price = (reg.value && sel.value) ? AZ.shippingPrice(reg.value, sel.value) : null;
        if (price == null) {
          shipEl.textContent = 'اختاري المدينة';
          totalEl.textContent = AZ.money(subtotal) + ' + التوصيل';
          tag.hidden = true;
        } else {
          shipEl.textContent = priceLabel(price);
          totalEl.textContent = AZ.money(subtotal + price);
          tag.textContent = 'التوصيل إلى ' + sel.value + ': ' + priceLabel(price);
          tag.hidden = false;
        }
      }

      function setStep(name) {
        stepsBar.querySelectorAll('.step').forEach(function (s) {
          var k = s.getAttribute('data-step');
          s.classList.toggle('on', k === name);
          if (k === name) s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
          s.classList.toggle('done', k === 'info' && name === 'confirm');
        });
      }

      function render() {
        captureDraft();
        if (AZ.errorBox(root)) return;
        var rows = AZ.cartDetailed();
        var s = AZ.getSettings();

        if (!rows.length) {
          setStep('info');
          root.innerHTML = '<div class="empty"><b>العربة فارغة</b>لم تُضيفي أي منتج بعد.' +
            '<div style="margin-top:1.2rem"><a class="btn btn-primary" href="shop.html">تسوّقي الآن</a></div></div>';
          return;
        }

        var subtotal = rows.reduce(function (a, r) { return a + r.lineTotal; }, 0);

        // المنطقة/المدينة من المسودة، مع التحقق أنها ما زالت ضمن القائمة
        var dRegion = draft.region || regionOfCity(draft.city);
        var dCity = (dRegion && AZ.shippingPrice(dRegion, draft.city) != null) ? draft.city : '';
        if (!AZ.getShippingRegions().some(function (r) { return r.name === dRegion; })) dRegion = '';

        var linesHTML = rows.map(function (r) {
          return '<div class="cart-line">' +
            '<a href="product.html?id=' + encodeURIComponent(r.id) + '"><img src="' + AZ.esc(r.image) + '" alt="' + AZ.esc(r.name) + '"></a>' +
            '<div>' +
              '<h3><a href="product.html?id=' + encodeURIComponent(r.id) + '">' + AZ.esc(r.name) + '</a></h3>' +
              '<p class="meta">' + (r.size ? 'المقاس: ' + AZ.esc(r.size) + ' · ' : '') + (r.color ? AZ.esc(r.color) + ' · ' : '') + AZ.money(r.price) + '</p>' +
              '<div class="qty" style="margin-top:.45rem">' +
                '<button type="button" data-key="' + AZ.esc(r.key) + '" data-step-qty="-1" aria-label="تقليل">−</button>' +
                '<input type="number" min="1" max="' + r.stock + '" value="' + r.qty + '" data-qty="' + AZ.esc(r.key) + '" aria-label="الكمية">' +
                '<button type="button" data-key="' + AZ.esc(r.key) + '" data-step-qty="1" aria-label="زيادة">+</button>' +
              '</div>' +
              '<button class="remove-btn" type="button" data-remove="' + AZ.esc(r.key) + '">إزالة</button>' +
            '</div>' +
            '<div class="price">' + AZ.money(r.lineTotal) + '</div>' +
          '</div>';
        }).join('');

        root.innerHTML = '<div class="cart-grid">' +
          '<div>' + linesHTML + '</div>' +
          '<div class="cart-side">' +
            '<h2 class="section-title" style="font-size:1.25rem;margin-bottom:.75rem">ملخص الطلب</h2>' +
            '<div class="sum-row"><span>المجموع الفرعي</span><span>' + AZ.money(subtotal) + '</span></div>' +
            '<div class="sum-row"><span>التوصيل</span><span id="sum-ship">اختاري المدينة</span></div>' +
            '<div class="sum-row total"><span>الإجمالي</span><span id="sum-total">' + AZ.money(subtotal) + '</span></div>' +
            '<form id="checkout-form" style="margin-top:1.2rem" novalidate>' +
              '<div class="field"><label for="c-name">الاسم الكامل <span class="req-star">*</span></label>' +
                '<input class="input" id="c-name" name="name" required autocomplete="name" aria-describedby="err-name" value="' + AZ.esc(draft.name || '') + '">' +
                '<span class="field-err" id="err-name" role="alert" hidden>أدخلي الاسم الكامل (3 أحرف على الأقل)</span></div>' +
              '<div class="field"><label for="c-phone">رقم الهاتف <span class="req-star">*</span></label>' +
                '<input class="input" id="c-phone" name="phone" type="tel" inputmode="tel" dir="ltr" required autocomplete="tel" placeholder="09xxxxxxxx" aria-describedby="err-phone" value="' + AZ.esc(draft.phone || '') + '">' +
                '<span class="field-err" id="err-phone" role="alert" hidden>رقم هاتف غير صحيح (مثال: 0912345678)</span></div>' +
              (ratesOk ? '' : '<div class="notice-box err" style="margin-bottom:.9rem">تعذر تحميل مدن وأسعار التوصيل. حدّثي الصفحة، أو اطلبي عبر واتساب مباشرة.</div>') +
              '<div class="form-row">' +
                '<div class="field"><label for="c-region">المنطقة <span class="req-star">*</span></label>' +
                  '<select class="select" id="c-region" name="region" required aria-describedby="err-region">' + regionOptions(dRegion) + '</select>' +
                  '<span class="field-err" id="err-region" role="alert" hidden>اختاري منطقة التوصيل</span></div>' +
                '<div class="field"><label for="c-city">المدينة <span class="req-star">*</span></label>' +
                  '<input class="input ship-search" id="c-city-search" type="search" placeholder="ابحثي عن مدينتك…" aria-label="بحث عن مدينة" aria-controls="c-city" autocomplete="off">' +
                  '<select class="select" id="c-city" name="city" required aria-describedby="err-city"' + (dRegion ? '' : ' disabled') + '>' + cityOptions(dRegion, '', dCity) + '</select>' +
                  '<span class="field-err" id="err-city" role="alert" hidden>اختاري مدينة التوصيل</span></div>' +
              '</div>' +
              '<p class="ship-tag" id="ship-tag" aria-live="polite" hidden></p>' +
              '<div class="field"><label for="c-address">العنوان (الحي، أقرب معلم)</label><input class="input" id="c-address" name="address" autocomplete="street-address" value="' + AZ.esc(draft.address || '') + '"></div>' +
              '<div class="field"><label for="c-note">ملاحظات (اختياري)</label><textarea class="textarea" id="c-note" name="note" rows="2">' + AZ.esc(draft.note || '') + '</textarea></div>' +
              '<label class="checkbox-line"><input type="checkbox" id="c-save" checked> <span>احفظي بياناتي للطلب القادم</span></label>' +
              '<button class="btn btn-wa btn-block btn-lg" type="submit" id="checkout-btn">تأكيد الطلب عبر واتساب</button>' +
              '<p class="hint" style="text-align:center;margin-top:.6rem">سيتم حفظ طلبك وتوجيهك إلى واتساب لتأكيده.</p>' +
              '<div class="notice-box err" id="checkout-fallback" style="margin-top:1rem" hidden></div>' +
            '</form>' +
          '</div>' +
        '</div>';
        setStep('info');
        updateShipping();
      }

      // أحداث العربة
      root.addEventListener('click', function (e) {
        var stepBtn = e.target.closest('[data-step-qty]');
        if (stepBtn) {
          var key = stepBtn.getAttribute('data-key');
          var row = AZ.cartDetailed().filter(function (r) { return r.key === key; })[0];
          if (row) {
            var next = row.qty + Number(stepBtn.getAttribute('data-step-qty'));
            if (next > row.stock) AZ.toast('وصلتِ لأقصى كمية متوفرة', 'err');
            AZ.setQty(key, next);
          }
          render();
          return;
        }
        var rm = e.target.closest('[data-remove]');
        if (rm) { AZ.removeFromCart(rm.getAttribute('data-remove')); render(); AZ.toast('تمت الإزالة'); }
      });

      function clearErr(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.hidden = true;
        var fld = el.closest('.field');
        if (fld) fld.classList.remove('has-err');
      }

      // البحث عن مدينة
      root.addEventListener('input', function (e) {
        if (e.target.id !== 'c-city-search') return;
        refreshCities(document.getElementById('c-city').value);
      });

      root.addEventListener('change', function (e) {
        if (e.target.id === 'c-region') {
          document.getElementById('c-city-search').value = '';
          refreshCities('');
          clearErr('err-region');
          return;
        }
        if (e.target.id === 'c-city') {
          // مدينة مختارة من بحث شامل → نضبط المنطقة تلقائياً ونعرض مدنها
          var opt = e.target.selectedOptions[0];
          var reg = document.getElementById('c-region');
          var city = e.target.value;
          if (opt && opt.getAttribute('data-region') && reg.value !== opt.getAttribute('data-region')) {
            reg.value = opt.getAttribute('data-region');
            document.getElementById('c-city-search').value = '';
            refreshCities(city);
          } else {
            updateShipping();
          }
          if (city) { clearErr('err-city'); clearErr('err-region'); }
          return;
        }
        var inp = e.target.closest('[data-qty]');
        if (!inp) return;
        AZ.setQty(inp.getAttribute('data-qty'), Math.max(1, Number(inp.value) || 1));
        render();
      });

      // إرسال الطلب
      root.addEventListener('submit', function (e) {
        if (e.target.id !== 'checkout-form') return;
        e.preventDefault();
        if (sending) return;

        var f = e.target;
        var name = f.name.value.trim();
        var phone = f.phone.value.trim();
        var phoneDigits = phone.replace(/\D/g, '');

        // تحقق مع رسائل واضحة
        var ok = true;
        function setErr(id, show) {
          var el = document.getElementById(id);
          var fld = el.closest('.field');
          el.hidden = !show;
          if (fld) fld.classList.toggle('has-err', show);
          var inp = fld && fld.querySelector('.input, .select');
          if (inp) inp.setAttribute('aria-invalid', show ? 'true' : 'false');
          if (show) ok = false;
        }
        var region = f.region.value, city = f.city.value;
        var shipPrice = (region && city) ? AZ.shippingPrice(region, city) : null;
        setErr('err-name', name.length < 3);
        setErr('err-phone', !/^(?:218|0)?9\d{8}$/.test(phoneDigits));
        setErr('err-region', !region);
        setErr('err-city', !!region && shipPrice == null);

        if (!ok) {
          AZ.toast(ratesOk ? 'يرجى تصحيح البيانات المطلوبة' : 'تعذر تحميل مدن التوصيل، حدّثي الصفحة', 'err');
          var firstErr = document.querySelector('.has-err .input, .has-err .select:not([disabled])');
          if (firstErr) firstErr.focus();
          return;
        }

        var items = AZ.cartDetailed();
        if (!items.length) { render(); return; }

        // لا نرسل سعر التوصيل: الخادم يقرأه من جدول shipping_rates حسب المنطقة والمدينة
        var customer = {
          name: name, phone: phone, region: region, city: city,
          address: f.address.value.trim(), note: f.note.value.trim()
        };
        captureDraft();

        // حفظ بيانات الزبونة
        if (document.getElementById('c-save').checked) {
          saveInfo({ name: name, phone: phone, region: region, city: city, address: customer.address });
        }

        // فتح نافذة واتساب الآن (داخل نقرة المستخدم) كي لا يحظرها المتصفح، ثم توجيهها بعد الحفظ
        var win = window.open('', '_blank');

        // تعطيل الزر + عرض شريط التقدم
        sending = true;
        var btn = document.getElementById('checkout-btn');
        var fallback = document.getElementById('checkout-fallback');
        btn.disabled = true;
        btn.textContent = 'جارٍ الحفظ…';
        fallback.hidden = true;
        setStep('confirm');

        // الخادم يحسب الأسعار ويخصم المخزون ويولّد رقم الطلب
        AZ.placeOrder(items, customer).then(function (res) {
          if (res.ok) {
            var order = res.order;
            try { localStorage.setItem('aziza_last_order', JSON.stringify(order)); } catch (e) {}
            AZ.clearCart();
            // الرسالة مبنية من الطلب الذي أعاده الخادم (أسعار حقيقية)
            var link = AZ.waLink(AZ.orderMessage(order));
            if (win) { try { win.opener = null; win.location.href = link; } catch (e) {} }
            setTimeout(function () { location.href = 'order-success.html?id=' + encodeURIComponent(order.id); }, 400);
            return;
          }

          if (win) { try { win.close(); } catch (e) {} }
          sending = false;
          AZ.toast(res.message, 'err');

          if (res.known) {
            // خطأ في البيانات أو المخزون: نعيد الرسم (العربة تتحدث بالمخزون الجديد)
            if (res.code === 'invalid_city') ratesOk = AZ.getShippingRegions().length > 0;
            render();
            var focusId = { invalid_name: 'c-name', invalid_phone: 'c-phone', invalid_city: 'c-region' }[res.code];
            if (focusId) {
              var bad = document.getElementById(focusId);
              if (bad) bad.focus();
            }
            var fb = document.getElementById('checkout-fallback');
            if (fb) { fb.textContent = res.message; fb.hidden = false; }
            return;
          }

          // عطل في الاتصال أو الخادم: نبقي العربة ونقترح الإرسال اليدوي عبر واتساب
          btn.disabled = false;
          btn.textContent = 'إعادة المحاولة';
          setStep('info');
          var rowsNow = AZ.cartDetailed();
          var sub = rowsNow.reduce(function (a, r) { return a + r.lineTotal; }, 0);
          var ship = AZ.shippingPrice(region, city) || 0;
          var draftOrder = {
            id: 'غير محفوظ في النظام',
            items: rowsNow.map(function (r) { return { name: r.name, price: r.price, qty: r.qty, size: r.size, color: r.color }; }),
            subtotal: sub, shipping: ship, total: sub + ship, customer: customer
          };
          fallback.innerHTML = '<b>' + AZ.esc(res.message) + '</b><br>' +
            'يمكنكِ إعادة المحاولة، أو <a href="' + AZ.esc(AZ.waLink(AZ.orderMessage(draftOrder))) +
            '" target="_blank" rel="noopener" style="text-decoration:underline">إرسال الطلب يدوياً عبر واتساب</a> (الأسعار تُؤكَّد من البوتيك).';
          fallback.hidden = false;
        });
      });

      // أسعار التوصيل تُحمَّل قبل أول رسم؛ إن فشلت تُعرض رسالة ويُمنع الإرسال
      AZ.loadShippingRates().then(function (regions) {
        ratesOk = !!(regions && regions.length);
        render();
      });
    });
  </script>
</body>
</html>
